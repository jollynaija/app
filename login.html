<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | ConnectNaija</title>
  <meta name="description" content="Log in to your ConnectNaija account.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6B2D3C">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="ConnectNaija Home">
        <div class="logo-mark">C</div>
        <span class="logo-text">Connect<span>Naija</span></span>
      </a>
      <div class="header-actions">
        <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
        <button class="mobile-menu-btn" aria-label="Open menu" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" role="dialog">
    <div class="mobile-nav-panel">
      <div class="mobile-nav-header">
        <span class="logo-text">Connect<span>Naija</span></span>
        <button class="mobile-nav-close btn-icon" aria-label="Close menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="mobile-nav-links">
        <a href="browse.html">Browse Profiles</a>
        <a href="list-profile.html">List Your Profile</a>
        <a href="register.html">Sign Up</a>
      </nav>
    </div>
  </div>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to manage your profile and favorites.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" class="form-input" id="login-email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-toggle">
            <input type="password" class="form-input" id="login-password" required placeholder="Your password">
            <button type="button" class="password-toggle-btn" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5)">
          <div class="form-check" style="margin:0">
            <input type="checkbox" id="remember-me">
            <label for="remember-me">Remember me</label>
          </div>
          <a href="register.html#reset" style="font-size:var(--text-sm)">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Log In</button>
      </form>
      
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Sign up</a>
      </div>
    </div>
  </main>

  <script src="js/navigation.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

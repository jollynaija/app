<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | ConnectNaija</title>
  <meta name="description" content="Create your ConnectNaija account. For adults 18+ in Nigeria.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6B2D3C">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="ConnectNaija Home">
        <div class="logo-mark">C</div>
        <span class="logo-text">Connect<span>Naija</span></span>
      </a>
      <div class="header-actions">
        <a href="login.html" class="btn btn-ghost btn-sm">Log In</a>
        <button class="mobile-menu-btn" aria-label="Open menu" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" role="dialog">
    <div class="mobile-nav-panel">
      <div class="mobile-nav-header">
        <span class="logo-text">Connect<span>Naija</span></span>
        <button class="mobile-nav-close btn-icon" aria-label="Close menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="mobile-nav-links">
        <a href="browse.html">Browse Profiles</a>
        <a href="login.html">Log In</a>
      </nav>
    </div>
  </div>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create an account</h1>
      <p class="auth-subtitle">Join ConnectNaija. For consenting adults 18 and above.</p>
      
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-email">Email <span class="required">*</span></label>
          <input type="email" class="form-input" id="reg-email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-phone">Phone (optional)</label>
          <input type="tel" class="form-input" id="reg-phone" data-phone placeholder="+234">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
          <div class="password-toggle">
            <input type="password" class="form-input" id="reg-password" required minlength="8" placeholder="At least 8 characters">
            <button type="button" class="password-toggle-btn" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password-confirm">Confirm Password <span class="required">*</span></label>
          <div class="password-toggle">
            <input type="password" class="form-input" id="reg-password-confirm" required placeholder="Repeat password">
            <button type="button" class="password-toggle-btn" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-check">
          <input type="checkbox" id="reg-18" required>
          <label for="reg-18">I confirm that I am 18 years of age or older.</label>
        </div>
        <div class="form-check">
          <input type="checkbox" id="reg-terms" required>
          <label for="reg-terms">I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</label>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:var(--space-4)">Create Account</button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </main>

  <script src="js/navigation.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
